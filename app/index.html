<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自迭代学习系统</title>
<link rel="stylesheet" href="assets/styles.css?v=9">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">LX</div>
      <span class="brand-name">自迭代学习系统</span>
    </div>
    <div class="domain-switch" id="domainSwitch"></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="data-menu" id="dataMenu">
        <button class="icon-btn" id="dataBtn" title="学习数据">···</button>
        <div class="menu-pop" id="menuPop">
          <button id="exportBtn">导出进度</button>
          <button id="importBtn">导入进度</button>
          <button id="resetBtn" class="danger">重置当前领域</button>
        </div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="page-head">
      <div>
        <h1 id="viewTitle"></h1>
        <p id="viewDesc"></p>
      </div>
      <div class="top-progress" id="topProgress"></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<input type="file" id="importFile" accept=".json" hidden>
<div class="toast" id="toast"></div>
<script src="assets/data-ai.js?v=15"></script>
<script src="assets/data-robotics.js?v=15"></script>
<script src="assets/app.js?v=15"></script>
</body>
</html>
